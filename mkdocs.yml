site_name: WhatsApp Docs
site_description: Reverse-engineered documentation of WhatsApp Android internals
site_url: https://docs.baron0.com/
docs_dir: .site-src
site_dir: site
use_directory_urls: true
theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle: {icon: material/weather-sunny, name: Light mode}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle: {icon: material/weather-night, name: Dark mode}
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: "Startseite"
