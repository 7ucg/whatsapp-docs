site_name: WhatsApp Docs
site_description: Reverse-engineered documentation of WhatsApp Android internals
site_url: https://docs.baron0.com/
docs_dir: .site-src
site_dir: site
use_directory_urls: true
theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle: {icon: material/weather-sunny, name: Light mode}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle: {icon: material/weather-night, name: Dark mode}
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: "Startseite"
            Changelog: "Changelog"
            Reports: "Berichte"
            Ban System: "Ban-System"
            TCToken & CSToken: "TCToken & CSToken"
            Meta AI: "Meta AI"
            Reporting: "Meldesystem"
            Client Integrity: "Client-Integrität"
            Linked-Device Pairing: "Geräte-Kopplung"
            Username: "Benutzername"
            Account Security: "Kontosicherheit"
            App-State Sync: "App-State-Sync"
            Noise Transport: "Noise-Transport"
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: "Inicio"
            Changelog: "Registro de cambios"
            Reports: "Informes"
            Ban System: "Sistema de baneos"
            TCToken & CSToken: "TCToken y CSToken"
            Meta AI: "Meta AI"
            Reporting: "Reportes"
            Client Integrity: "Integridad del cliente"
            Linked-Device Pairing: "Vinculación de dispositivos"
            Username: "Nombre de usuario"
            Account Security: "Seguridad de la cuenta"
            App-State Sync: "Sincronización de estado"
            Noise Transport: "Transporte Noise"
        - locale: pt-BR
          name: Português (BR)
          build: true
          nav_translations:
            Home: "Início"
            Changelog: "Changelog"
            Reports: "Relatórios"
            Ban System: "Sistema de banimento"
            TCToken & CSToken: "TCToken e CSToken"
            Meta AI: "Meta AI"
            Reporting: "Denúncias"
            Client Integrity: "Integridade do cliente"
            Linked-Device Pairing: "Vínculo de dispositivos"
            Username: "Nome de usuário"
            Account Security: "Segurança da conta"
            App-State Sync: "Sincronização de estado"
            Noise Transport: "Transporte Noise"
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Home: "Главная"
            Changelog: "Журнал изменений"
            Reports: "Отчёты"
            Ban System: "Система банов"
            TCToken & CSToken: "TCToken и CSToken"
            Meta AI: "Meta AI"
            Reporting: "Жалобы"
            Client Integrity: "Целостность клиента"
            Linked-Device Pairing: "Привязка устройств"
            Username: "Имя пользователя"
            Account Security: "Безопасность аккаунта"
            App-State Sync: "Синхронизация состояния"
            Noise Transport: "Транспорт Noise"
        - locale: ar
          name: العربية
          build: true
          nav_translations:
            Home: "الرئيسية"
            Changelog: "سجل التغييرات"
            Reports: "التقارير"
            Ban System: "نظام الحظر"
            TCToken & CSToken: "TCToken و CSToken"
            Meta AI: "Meta AI"
            Reporting: "نظام البلاغات"
            Client Integrity: "سلامة العميل"
            Linked-Device Pairing: "ربط الأجهزة"
            Username: "اسم المستخدم"
            Account Security: "أمان الحساب"
            App-State Sync: "مزامنة الحالة"
            Noise Transport: "نقل Noise"
        - locale: tr
          name: Türkçe
          build: true
          nav_translations:
            Home: "Ana sayfa"
            Changelog: "Değişiklik günlüğü"
            Reports: "Raporlar"
            Ban System: "Yasaklama sistemi"
            TCToken & CSToken: "TCToken ve CSToken"
            Meta AI: "Meta AI"
            Reporting: "Raporlama"
            Client Integrity: "İstemci bütünlüğü"
            Linked-Device Pairing: "Cihaz eşleştirme"
            Username: "Kullanıcı adı"
            Account Security: "Hesap güvenliği"
            App-State Sync: "Durum eşitleme"
            Noise Transport: "Noise aktarımı"
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc: {permalink: true, toc_depth: 3}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/7ucg
      name: GitHub profile
    - icon: fontawesome/brands/github-alt
      link: https://github.com/7ucg/whatsapp-docs
      name: Repository
    - icon: fontawesome/brands/discord
      link: https://discord.gg/R77JyK2Fu6
      name: Discord
    - icon: fontawesome/brands/telegram
      link: https://t.me/wegschleifen
      name: Telegram
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js
nav:
  - Home: index.md
  - Changelog: CHANGELOG.md
  - Reports:
    - Ban System: WA_BAN_SYSTEM_DEEP_EN.md
    - TCToken & CSToken: WA_TCTOKEN_CSTOKEN.md
    - Meta AI: WA_META_AI.md
    - Reporting: WA_REPORTING.md
    - Client Integrity: WA_CLIENT_INTEGRITY.md
    - Linked-Device Pairing: WA_LINKED_DEVICE_PAIRING.md
    - Username: WA_USERNAME.md
    - Account Security: WA_ACCOUNT_SECURITY.md
    - App-State Sync: WA_APPSTATE_SYNC.md
    - Noise Transport: WA_NOISE_TRANSPORT.md
